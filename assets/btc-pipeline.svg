<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline de datos de BTC</title>
  <desc id="desc">Fuentes de mercado y tipo de cambio, ingesta en AWS, almacenamiento en S3 y consultas con Athena.</desc>
  <rect width="480" height="640" rx="16" fill="#101216"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#7ebeff" stroke-width="1.5"/></marker></defs>
  <g font-family="monospace" text-anchor="middle">
    <text x="240" y="42" fill="#7d8597" font-size="14" letter-spacing="2">DEL MERCADO A LA CONSULTA</text>
    <g fill="#181b21" stroke="#353b46" stroke-width="2">
      <rect x="40" y="68" width="400" height="100" rx="12"/>
      <rect x="40" y="216" width="400" height="100" rx="12"/>
      <rect x="40" y="364" width="400" height="100" rx="12"/>
      <rect x="40" y="512" width="400" height="100" rx="12"/>
    </g>
    <g fill="#b79eff" font-size="15">
      <text x="240" y="99">01 · FUENTES</text><text x="240" y="247">02 · INGESTA</text>
      <text x="240" y="395">03 · ALMACENAMIENTO</text><text x="240" y="543">04 · CONSULTA</text>
    </g>
    <g fill="#dce0e8" font-size="21">
      <text x="240" y="133">Buda.com · Binance</text><text x="240" y="281">Lambda + Step Functions</text>
      <text x="240" y="429">S3 · crudos y Parquet</text><text x="240" y="577">Athena · SQL</text>
    </g>
    <text x="240" y="155" fill="#9ba3b4" font-size="14">+ tipo de cambio USD/CLP</text>
  </g>
  <g stroke="#7ebeff" stroke-width="2" marker-end="url(#arrow)"><path d="M240 178v26"/><path d="M240 326v26"/><path d="M240 474v26"/></g>
